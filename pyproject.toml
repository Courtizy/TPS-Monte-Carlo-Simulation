[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tps-core"
dynamic = ["version"]
description = "Turn Pattern Sustainability model: go-level Monte Carlo of a weekly flying schedule."
requires-python = ">=3.11"
dependencies = []

[tool.setuptools.packages.find]
where = ["model"]

[tool.setuptools.dynamic]
version = { attr = "tps_core.version.__version__" }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["model"]
