name: Test and publish

# test -> export -> publish. Deploys on every push to main (TPS's choice; the kit default is manual
# until the public-release review). The public site shows synthetic inputs only.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - name: Tests, including the golden outputs (nothing publishes unless they pass)
        run: pytest -q
      - name: Export the site from the public configs, stamped ?v=<commit>
        run: python scripts/export_site.py --commit "$GITHUB_SHA" --stamp
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v5
