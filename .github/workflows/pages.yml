name: Test and publish the proof of concept

# Runs from the repo root: tests in tests/, model in model/, page in app/.
# GitHub only runs workflows from .github/workflows/.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install pytest
      - name: Model tests (must pass before anything publishes)
        run: pytest -q

  build:
    needs: test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Check the brand kit is present
        run: |
          if [ ! -f app/brand/css/brand.css ]; then
            echo "::warning::No app/brand/ folder. The site will publish without the brand styles."
          fi
      - name: Build the site with the version and commit stamped in
        run: python scripts/build_site.py --out site --commit "$GITHUB_SHA"
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
