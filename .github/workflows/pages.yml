name: Test and publish the proof of concept

# The proof of concept lives in browser_base/. This file must sit at the repo root,
# in .github/workflows/, because GitHub only runs workflows from there.

on:
  push:
    branches: [main]
    paths:
      - "browser_base/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

defaults:
  run:
    working-directory: browser_base

jobs:
  test:
    # Pinned so the runner image only changes when this line does.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install pytest
      - name: Model tests (must pass before anything publishes)
        run: pytest tests_core -q

  build:
    needs: test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Build the site with the version and commit stamped in
        run: python scripts/build_site.py --out site --commit "$GITHUB_SHA"
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: browser_base/site

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
